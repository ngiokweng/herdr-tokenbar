id = "herdr.tokenbar"
name = "TokenBar"
version = "0.1.2"
min_herdr_version = "0.9.4"
description = "Show per-agent token usage and context progress in the sidebar and tab bar."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["npm", "ci", "--omit=dev", "--ignore-scripts"]

[[startup]]
command = ["node", "src/setup.mjs", "refresh"]

[[actions]]
id = "enable"
title = "Show token usage in the tab bar"
command = ["node", "src/setup.mjs", "enable"]

[[actions]]
id = "disable"
title = "Remove token usage from the tab bar"
command = ["node", "src/setup.mjs", "disable"]
